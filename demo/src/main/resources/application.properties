spring.application.name=demo

# Puerto: 8080 en local; los hostings (Render, Railway...) lo inyectan en la variable PORT
server.port=${PORT:8080}
# Detrás de un proxy HTTPS (hosting) respeta el esquema/host original
server.forward-headers-strategy=framework
# El listado de productos puede ser grande: se comprime el JSON
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,text/javascript

# Base de datos H2 en archivo. Con DB_PATH se puede apuntar a un disco persistente del hosting
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/catalogo};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola de H2: activa en local; en producción se apaga con H2_CONSOLE=false
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console
